spring.application.name=dulceria
spring.thymeleaf.cache=false
server.error.include-message=always
 
# ---------- Conexión a PostgreSQL ----------
spring.datasource.url=jdbc:postgresql://localhost:5432/dulceria
spring.datasource.username=dulceria
spring.datasource.password=portal2026
 
# ---------- JPA / Hibernate ----------
# update: crea las tablas que falten según las clases @Entity (solo en desarrollo)
spring.jpa.hibernate.ddl-auto=update
# Mostrar en la consola el SQL que Hibernate envía a PostgreSQL
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

