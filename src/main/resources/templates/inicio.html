<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<!-- th:replace: esta etiqueta se REEMPLAZA por el fragmento indicado -->
<head th:replace="~{fragments/layout :: head('Inicio')}"></head>
<body>
<nav th:replace="~{fragments/layout :: menu('inicio')}"></nav>
 
<main>
  <section class="portada">
    <div class="container">
      <p class="eslogan mb-1" th:text="${saludo}">¡Hola!</p>
      <h1 class="display-5 fw-bold">Dulces típicos del Portal de los Dulces</h1>
      <p class="lead">Cocadas, alegrías, panelitas y conservas hechas a mano en Cartagena de Indias.</p>
      <p class="mb-3"><strong>Horario:</strong> <span th:text="${horario}">Horario</span></p>
      <a class="btn btn-warning fw-bold" th:href="@{/catalogo}">Ver el catálogo</a>
    </div>
  </section>
 
  <section class="container py-5">
    <h2 class="h4 mb-3">Los más pedidos</h2>
    <div class="row g-3">
      <div class="col-md-4" th:each="d : ${destacados}">
        <div class="card tarjeta-dulce h-100 p-3">
          <div class="d-flex gap-3 align-items-center">
            <!-- #strings.substring toma la primera letra del nombre -->
            <div class="inicial" th:text="${#strings.substring(d.nombre, 0, 1)}">C</div>
            <div>
              <h3 class="h6 mb-0" th:text="${d.nombre}">Nombre</h3>
              <small class="text-muted" th:text="${d.categoria.nombre}">Categoría</small>
            </div>
          </div>
          <p class="precio mt-3 mb-0" th:text="'$ ' + ${#numbers.formatInteger(d.precio, 1, 'POINT')}">$ 0</p>
        </div>
      </div>
    </div>
  </section>
</main>
 
<footer th:replace="~{fragments/layout :: pie}"></footer>
</body>
</html>
