<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${dulce.nombre})}"></head>
<body>
<nav th:replace="~{fragments/layout :: menu('catalogo')}"></nav>
 
<main class="container py-4" style="max-width: 760px;">
  <div th:replace="~{fragments/layout :: alertas}"></div>
  <a th:href="@{/catalogo}">&larr; Volver al catálogo</a>
 
  <div class="card tarjeta-dulce p-4 mt-3">
    <div class="d-flex gap-3 align-items-center">
      <div class="inicial" th:text="${#strings.substring(dulce.nombre, 0, 1)}">C</div>
      <div>
        <h1 class="h3 mb-0" th:text="${dulce.nombre}">Nombre</h1>
        <a class="small" th:href="@{/catalogo(categoria=${dulce.categoria})}" th:text="${dulce.categoria.nombre}">Categoría</a>
      </div>
    </div>
    <p class="mt-3" th:text="${dulce.descripcion}">Descripción</p>
    <p class="precio" th:text="'$ ' + ${#numbers.formatInteger(dulce.precio, 1, 'POINT')} + ' por unidad'">$ 0</p>
    <p class="mb-0">
      <span class="badge bg-success" th:if="${dulce.disponible}">Disponible para encargo</span>
      <span class="badge bg-secondary" th:unless="${dulce.disponible}">Agotado por hoy</span>
    </p>
  </div>
 
  <!-- NUEVO · Formulario de encargo: solo si el dulce está disponible -->
  <div class="card tarjeta-dulce p-4 mt-3" th:if="${dulce.disponible}">
    <h2 class="h5">Haga su encargo</h2>
    <form th:action="@{/catalogo/{id}/encargos(id=${dulce.id})}" th:object="${encargo}" method="post" novalidate>
      <div class="row">
        <div class="col-md-7 mb-3">
          <label for="nombreCliente" class="form-label">Su nombre</label>
          <input type="text" class="form-control" th:field="*{nombreCliente}" th:errorclass="is-invalid">
          <div class="invalid-feedback" th:errors="*{nombreCliente}">Error</div>
        </div>
        <div class="col-md-5 mb-3">
          <label for="telefono" class="form-label">Celular</label>
          <input type="tel" class="form-control" th:field="*{telefono}" th:errorclass="is-invalid" placeholder="3001234567">
          <div class="invalid-feedback" th:errors="*{telefono}">Error</div>
        </div>
        <div class="col-md-4 mb-3">
          <label for="cantidad" class="form-label">Cantidad</label>
          <input type="number" class="form-control" th:field="*{cantidad}" th:errorclass="is-invalid">
          <div class="invalid-feedback" th:errors="*{cantidad}">Error</div>
        </div>
        <div class="col-md-8 mb-3">
          <label for="fechaEntrega" class="form-label">Fecha de entrega</label>
          <input type="date" class="form-control" th:field="*{fechaEntrega}" th:errorclass="is-invalid">
          <div class="invalid-feedback" th:errors="*{fechaEntrega}">Error</div>
        </div>
      </div>
      <button type="submit" class="btn btn-marca">Enviar encargo</button>
    </form>
  </div>
</main>
 
<footer th:replace="~{fragments/layout :: pie}"></footer>
</body>
</html>
