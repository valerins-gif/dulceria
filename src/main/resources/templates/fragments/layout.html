<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
 
<head th:fragment="head(titulo)">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:text="${titulo} + ' · Dulces Doña Ana'">Dulces Doña Ana</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" th:href="@{/css/dulceria.css}">
</head>
 
<body>
 
<nav th:fragment="menu(activo)" class="navbar navbar-expand navbar-dark barra">
  <div class="container">
    <a class="navbar-brand fw-bold" th:href="@{/}">Dulces Doña Ana</a>
    <ul class="navbar-nav">
      <li class="nav-item">
        <a class="nav-link" th:classappend="${activo == 'inicio'} ? 'active'" th:href="@{/}">Inicio</a>
      </li>
      <li class="nav-item">
        <a class="nav-link" th:classappend="${activo == 'catalogo'} ? 'active'" th:href="@{/catalogo}">Catálogo</a>
      </li>
      <li class="nav-item">
        <a class="nav-link" th:classappend="${activo == 'admin'} ? 'active'" th:href="@{/admin/dulces}">Administrar</a>
      </li>
      <!-- NUEVO · Enlace a los encargos -->
      <li class="nav-item">
        <a class="nav-link" th:classappend="${activo == 'encargos'} ? 'active'" th:href="@{/admin/encargos}">Encargos</a>
      </li>
    </ul>
  </div>
</nav>
 
<!-- Fragmento 4: mensajes de éxito o de error -->
<div th:fragment="alertas">
  <div class="alert alert-success" th:if="${mensaje}" th:text="${mensaje}">Mensaje</div>
  <div class="alert alert-danger" th:if="${error}" th:text="${error}">Error</div>
</div>
 
<footer th:fragment="pie" class="pie">
  <div class="container">
    Dulces Doña Ana · Portal de los Dulces, Centro Histórico de Cartagena ·
    Proyecto de formación SENA ADSO
  </div>
</footer>
 
</body>
</html>
